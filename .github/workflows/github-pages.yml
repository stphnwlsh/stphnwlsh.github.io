name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  # A daily rebuild flips Movember mode on 1 November and off on 1 December,
  # so link previews show the right card. The page also checks the visitor's date itself.
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build
        run: node build.mjs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
